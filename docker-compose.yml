services:
  db:
    image: postgres:18-alpine
    container_name: first_react_nest_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      # Host port 5433 to avoid clashing with a local PostgreSQL on 5432
      - "5433:5432"
    volumes:
      # postgres:18 stores data in /var/lib/postgresql/18/docker
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
